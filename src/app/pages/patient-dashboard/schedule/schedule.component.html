<div class="title">
  <label>Dịch vụ khám bệnh</label>
</div>

<div style="background-color: white; height: 100%;">
  <!-- <h1 style="margin-bottom: 20px;">Dịch vụ khám bệnh</h1> -->

  <nz-select class="select-facility" nzPlaceHolder="Chọn khoa" (ngModelChange)="handleFacilityChange($event)"
    [ngModel]="'all'">
    <nz-option nzValue="all" nzLabel="Tất cả khoa"></nz-option>
    <nz-option *ngFor="let item of facility" [nzValue]="item.id" [nzLabel]="item.facility_name"></nz-option>
  </nz-select>

  <div style="margin-top: 20px; max-height: 720px; overflow-y: auto; padding-right: 8px;">
    <div nz-row [nzGutter]="16">
      <div nz-col *ngFor="let item of service" [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="6"
        style="margin-bottom: 16px;">
        <nz-card [nzHoverable]="true" (click)="handleCardClick(item, viewSchedule)" style="height: 100%;">
          <nz-card-meta [nzTitle]="item.name"></nz-card-meta>
          <img style="width: 100%; height: 150px; object-fit: cover; margin-top: 15px;" [src]="item.image"
            alt="Không có ảnh" />
          <p>Giá tiền: {{ item.price | number }}₫</p>
          <p>Mô tả: {{ item.description }}</p>
          <p *ngIf="item.facility">Tên bệnh viện: {{ item.facility.facility_name }}</p>
        </nz-card>
      </div>
    </div>
  </div>
</div>

<ng-template #viewSchedule let-modal>
  <form [formGroup]="scheduleForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <img style="width: 100%; height: 150px; object-fit: cover; margin-top: 15px; border-radius: 6px; border: 1px black solid;" [src]="selectedService?.image"
        alt="Không có ảnh" />
    </div>

    <div class="form-row">
      <input [value]="selectedService?.facility?.facility_name" disabled class="form-control" />
    </div>

    <div class="form-row">
      <input [value]="selectedService?.name" disabled class="form-control" />
    </div>

    <nz-form-item>
      <nz-form-control>
        <nz-select formControlName="doctorId" nzPlaceHolder="Chọn bác sĩ">
          <nz-option *ngFor="let item of doctor" [nzValue]="item.id" [nzLabel]="item.fullName"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

<nz-form-item>
  <nz-form-control [nzErrorTip]="'Vui lòng chọn ngày khám'">
    <nz-date-picker
      formControlName="testDate"
      [nzDisabledDate]="disabledDate"
      [nzDisabledTime]="disabledDateTime"
      nzShowTime
      nzFormat="DD/MM/YYYY HH:mm"
      nzPlaceHolder="Chọn ngày khám">
    </nz-date-picker>
  </nz-form-control>
</nz-form-item>


    <nz-form-item>
      <nz-form-control>
        <textarea formControlName="note" class="form-control" rows="2"></textarea>
      </nz-form-control>
    </nz-form-item>

    <div class="form-actions" style="display: flex; justify-content: flex-end;">
      <button nz-button nzType="default" (click)="handleCancel()">Hủy</button>
      <button nz-button nzType="primary" [disabled]="scheduleForm.invalid" style="margin-left: 10px;">Đặt lịch</button>
    </div>
  </form>
</ng-template>
