<div class="title">
  <label>Quản lý bác sĩ</label>
</div>

<div class="action-header">
  <button (click)="openViewDetailModal(createAccountDoctor)">Thêm mới tài khoản</button>
</div>

<app-table-common 
  [columns]="tableColumns" 
  [listOfData]="fullTableData" 
  [totalItems]="totalRecords"
  [pageSize]="pageSize" 
  (pageChange)="onTablePageChange($event)">
</app-table-common>

<ng-template #createAccountDoctor>
  <form [formGroup]="createAccountDoctorForm" (ngSubmit)="submitUpdate()" novalidate>
    <!-- Họ và tên -->
    <div class="form-group" [ngClass]="{'has-error': createAccountDoctorForm.get('fullName')?.invalid && createAccountDoctorForm.get('fullName')?.dirty}">
      <label>Họ và tên:<span class="required">*</span></label>
      <input nz-input formControlName="fullName" placeholder="Họ và tên" />
      <div class="error" *ngIf="createAccountDoctorForm.get('fullName')?.invalid && createAccountDoctorForm.get('fullName')?.dirty">
        Họ và tên không được để trống
      </div>
    </div>

    <!-- Email -->
    <div class="form-group" [ngClass]="{'has-error': createAccountDoctorForm.get('email')?.invalid && createAccountDoctorForm.get('email')?.dirty}">
      <label>Email:<span class="required">*</span></label>
      <input nz-input formControlName="email" placeholder="Email" />
      <div class="error" *ngIf="createAccountDoctorForm.get('email')?.errors?.['required'] && createAccountDoctorForm.get('email')?.dirty">
        Email không được để trống
      </div>
      <div class="error" *ngIf="createAccountDoctorForm.get('email')?.errors?.['email'] && createAccountDoctorForm.get('email')?.dirty">
        Email không đúng định dạng
      </div>
    </div>

    <!-- Số điện thoại -->
    <div class="form-group" [ngClass]="{'has-error': createAccountDoctorForm.get('phone')?.invalid && createAccountDoctorForm.get('phone')?.dirty}">
      <label>Số điện thoại:<span class="required">*</span></label>
      <input nz-input formControlName="phone" placeholder="Số điện thoại" />
      <div class="error" *ngIf="createAccountDoctorForm.get('phone')?.errors?.['required'] && createAccountDoctorForm.get('phone')?.dirty">
        Số điện thoại không được để trống
      </div>
      <div class="error" *ngIf="createAccountDoctorForm.get('phone')?.errors?.['pattern'] && createAccountDoctorForm.get('phone')?.dirty">
        Số điện thoại không hợp lệ
      </div>
    </div>

    <!-- Giới tính -->
    <div class="form-group" [ngClass]="{'has-error': createAccountDoctorForm.get('gender')?.invalid && createAccountDoctorForm.get('gender')?.dirty}">
      <label>Giới tính:<span class="required">*</span></label>
      <nz-select formControlName="gender" nzPlaceHolder="Chọn giới tính">
        <nz-option nzValue="MALE" nzLabel="Nam"></nz-option>
        <nz-option nzValue="FEMALE" nzLabel="Nữ"></nz-option>
      </nz-select>
      <div class="error" *ngIf="createAccountDoctorForm.get('gender')?.invalid && createAccountDoctorForm.get('gender')?.dirty">
        Vui lòng chọn giới tính
      </div>
    </div>

    <!-- Ngày sinh -->
    <div class="form-group" [ngClass]="{'has-error': createAccountDoctorForm.get('dateOfBirth')?.invalid && createAccountDoctorForm.get('dateOfBirth')?.dirty}">
      <label>Ngày sinh:<span class="required">*</span></label>
      <nz-date-picker formControlName="dateOfBirth" nzFormat="DD/MM/YYYY" placeholder="Chọn ngày sinh"></nz-date-picker>
      <div class="error" *ngIf="createAccountDoctorForm.get('dateOfBirth')?.invalid && createAccountDoctorForm.get('dateOfBirth')?.dirty">
        Vui lòng chọn ngày sinh
      </div>
    </div>

    <!-- Dịch vụ -->
    <div class="form-group" [ngClass]="{'has-error': createAccountDoctorForm.get('service_id')?.invalid && createAccountDoctorForm.get('service_id')?.dirty}">
      <label>Chọn dịch vụ:<span class="required">*</span></label>
      <nz-select formControlName="service_id" nzPlaceHolder="Chọn dịch vụ">
        <nz-option *ngFor="let service of serviceOptions" [nzValue]="service.value" [nzLabel]="service.label"></nz-option>
      </nz-select>
      <div class="error" *ngIf="createAccountDoctorForm.get('service_id')?.invalid && createAccountDoctorForm.get('service_id')?.dirty">
        Vui lòng chọn dịch vụ
      </div>
    </div>

    <!-- Địa chỉ -->
    <div class="form-group" [ngClass]="{'has-error': createAccountDoctorForm.get('address')?.invalid && createAccountDoctorForm.get('address')?.dirty}">
      <label>Địa chỉ:<span class="required">*</span></label>
      <input nz-input formControlName="address" placeholder="Địa chỉ" />
      <div class="error" *ngIf="createAccountDoctorForm.get('address')?.invalid && createAccountDoctorForm.get('address')?.dirty">
        Địa chỉ không được để trống
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button nz-button nzType="primary" type="submit" [disabled]="!createAccountDoctorForm.valid">Thêm mới</button>
      <button nz-button nzType="default" type="button" (click)="closeModal()">Hủy</button>
    </div>
  </form>
</ng-template>
