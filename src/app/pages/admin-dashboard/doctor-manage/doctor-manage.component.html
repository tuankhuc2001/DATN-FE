<div class="title">
  <label>Quản lý bác sĩ</label>
</div>
<div class="action-header">
  <button (click)="openViewDetailModal(createAccountDoctor)">Thêm mới tài khoản</button>
</div>
<app-table-common 
  [columns]="tableColumns" 
  [listOfData]="fullTableData" 
  [totalItems]="totalRecords"
  [pageSize]="pageSize" 
  (pageChange)="onTablePageChange($event)">
</app-table-common>

<ng-template #createAccountDoctor>
  <form [formGroup]="createAccountDoctorForm" (ngSubmit)="submitUpdate()">
    <div class="form-group">
      <label>Họ và tên:</label>
      <input nz-input formControlName="fullName" placeholder="Họ và tên" />
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input nz-input formControlName="email" placeholder="Email" />
    </div>

    <div class="form-group">
      <label>Số điện thoại:</label>
      <input nz-input formControlName="phone" placeholder="Số điện thoại" />
    </div>

    <div class="form-group">
      <label>Giới tính:</label>
      <nz-select formControlName="gender" nzPlaceHolder="Chọn giới tính">
        <nz-option nzValue="MALE" nzLabel="Nam"></nz-option>
        <nz-option nzValue="FEMALE" nzLabel="Nữ"></nz-option>
      </nz-select>
    </div>

<div class="form-group">
  <label>Ngày sinh:</label>
  <nz-date-picker formControlName="dateOfBirth" nzFormat="DD/MM/YYYY" placeholder="Chọn ngày sinh"></nz-date-picker>
</div>


    <div class="form-group">
      <label>Chọn dịch vụ:</label>
      <nz-select formControlName="service_id" nzPlaceHolder="Chọn dịch vụ">
        <nz-option *ngFor="let service of serviceOptions" [nzValue]="service.value" [nzLabel]="service.label">
        </nz-option>
      </nz-select>
    </div>

    <div class="form-group">
      <label>Địa chỉ:</label>
      <input nz-input formControlName="address" placeholder="Địa chỉ" />
    </div>

    <div class="modal-footer">
      <button nz-button nzType="primary" type="submit">Cập nhật</button>
      <button nz-button nzType="default" type="button" (click)="closeModal()">Hủy</button>
    </div>
  </form>
</ng-template>
